<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gæt et tal</title>
</head>

<body>

    <h1>Gæt et tal</h1>

    <p>Skriv et tal imellem 0 og 10</p>

    <input type="number" id="tal" min="0" max="10">
    <button id="knap">Tjek tal</button>


    <script>
        let hemmeligtTal = Math.floor(Math.random() * 11);
        let antalGæt = 0;

        document.querySelector("#knap").addEventListener("click", tjekTal);

        function tjekTal() {
            let brugerTal = Number(document.querySelector("#tal").value);

            if (brugerTal < 0 || brugerTal > 10) {
                alert("Du skal vælge et tal mellem 0 og 10");
                return;
            }

            antalGæt++;

            if (brugerTal < hemmeligtTal) {
                alert("Dit tal er for lavt. Prøv igen :)");
            }

            else if (brugerTal > hemmeligtTal) {
                alert("Dit tal er for højt. Prøv igen :)");
            }

            else {
                alert(
                    brugerTal +
                    " er rigtigt! Du brugte " +
                    antalGæt +
                    " forsøg."
                );

                let igen = confirm("Vil du prøve igen med et nyt tal?");

                if (igen) {
                    hemmeligtTal = Math.floor(Math.random() * 11);
                    antalGæt = 0;
                    document.querySelector("#tal").value = "";
                }
            }
        }
    </script>

</body>

</html>
